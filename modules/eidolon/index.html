      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

      pointer-events: auto;
    }

    #eidolon-overlay .panel { text-align: center; max-width: 420px; padding: 2rem; }
    #eidolon-overlay .msg { margin-bottom: 1.25rem; opacity: 0.85; line-height: 1.5; }
    #eidolon-overlay .load-btn {
      display: inline-block; padding: 0.65rem 1.25rem; border: 1px solid #555; border-radius: 6px;
      cursor: pointer; background: #1a1a1a;
    }
    #eidolon-overlay .load-btn:hover { border-color: #888; }
