<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orbs</title>
  <style>
    html, body {
      margin:0; height:100%; overflow:hidden;
      background:#05060a; color:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas { display:block; width:100vw; height:100vh; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "../../shared/libs/three-r160/three.module.js",
        "three/addons/": "../../shared/libs/three-r160/addons/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from "three";
    import "../../shared/mediaFeed.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    // ---------- UTILITIES & PALETTE GENERATION ----------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp  = (a, b, t) => a + (b - a) * t;

    function mulberry32(seed) {
      let t = seed >>> 0;
      return function() {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
    function randomUnitVector(rng) {
      const u = rng(), v = rng();
      const theta = 2 * Math.PI * u;
      const phi = Math.acos(2 * v - 1);
      return new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.sin(phi) * Math.sin(theta),
        Math.cos(phi)
      );
    }
    function sampleShellPosition(rng, radius, thickness) {
      const dir = randomUnitVector(rng);
      const r = radius + (rng() - 0.5) * thickness;
      return dir.multiplyScalar(r);
    }
    function hslToHex(h, s, l) {
      const c = new THREE.Color().setHSL(h, s, l);
      return `#${c.getHexString()}`;
    }
    function pickBaseHue({ warmCoolLock, baseHue }) {
      if (typeof baseHue === "number") return ((baseHue % 360) + 360) % 360;
      if (warmCoolLock === "warm") return 10 + Math.random() * 70;     
      if (warmCoolLock === "cool") return 150 + Math.random() * 160;   
      return Math.random() * 360;
    }
    function generatePalette({
      paletteMode = "analogous",
      warmCoolLock = "any",
      baseHue = null,
      minSaturation = 50,
      maxSaturation = 100,
      minLightness = 30,
      maxLightness = 70,
      ensureContrast = true
    } = {}) {
      const bhDeg = pickBaseHue({ warmCoolLock, baseHue });
      const bh = bhDeg / 360;
      const satA = (minSaturation + Math.random() * (maxSaturation - minSaturation)) / 100;
      const satB = (minSaturation + Math.random() * (maxSaturation - minSaturation)) / 100;
      const satC = (minSaturation + Math.random() * (maxSaturation - minSaturation)) / 100;

      let lA = (minLightness + Math.random() * (maxLightness - minLightness)) / 100;
      let lB = (minLightness + Math.random() * (maxLightness - minLightness)) / 100;
      let lC = (minLightness + Math.random() * (maxLightness - minLightness)) / 100;

      if (ensureContrast) {
        const bump = 0.18 + Math.random() * 0.12;
        lB = clamp(lA + bump, 0.15, 0.90);
        lC = clamp(lA - bump, 0.10, 0.85);
      }

      let h1 = bh, h2 = bh, h3 = bh;

      if (paletteMode === "analogous") {
        const spread = (10 + Math.random() * 28) / 360;
        h1 = (bh - spread + 1) % 1;
        h2 = bh;
        h3 = (bh + spread) % 1;
      } else if (paletteMode === "triadic") {
        h1 = bh;
        h2 = (bh + 1/3) % 1;
        h3 = (bh + 2/3) % 1;
      } else if (paletteMode === "complementary") {
        h1 = bh;
        h2 = (bh + 0.5) % 1;
        h3 = (bh + (Math.random() < 0.5 ? 0.08 : 0.58)) % 1;
      } else {
        h1 = Math.random();
        h2 = Math.random();
        h3 = Math.random();
      }
      return {
        c1: hslToHex(h1, satA, lA),
        c2: hslToHex(h2, satB, lB),
        c3: hslToHex(h3, satC, lC)
      };
    }
    function generateRandomPalette() {
      return generatePalette({
        paletteMode: (["analogous","triadic","complementary","random"])[Math.floor(Math.random()*4)],
        warmCoolLock: (["any","warm","cool"])[Math.floor(Math.random()*3)],
        baseHue: null,
        minSaturation: 55,
        maxSaturation: 100,
        minLightness: 28,
        maxLightness: 72,
        ensureContrast: Math.random() > 0.4
      });
    }
    function hexToColor(hex) { return new THREE.Color(hex);}
    function mixPalette(rng, palette, jitter) {
      const base = palette[Math.floor(rng() * palette.length)].clone();
      const hsl = {};
      base.getHSL(hsl);
      const dh = (rng() - 0.5) * 0.18 * jitter;
      const ds = (rng() - 0.5) * 0.35 * jitter;
      const dl = (rng() - 0.5) * 0.28 * jitter;
      hsl.h = (hsl.h + dh + 1) % 1;
      hsl.s = clamp(hsl.s + ds, 0, 1);
      hsl.l = clamp(hsl.l + dl, 0, 1);
      return new THREE.Color().setHSL(hsl.h, hsl.s, hsl.l);
    }

    // ---------- SCENE, BLENDING, GLOBALS ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    
    // Add renderer to body (will be moved to container by module.js if needed)
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05060a, 0.05);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 200);
    camera.position.set(0, 0, 14);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.55;
    controls.zoomSpeed = 0.9;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.06));

    // Composer + Bloom
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.2, 0.4, 0.15
    );
    composer.addPass(bloomPass);

    // ------------ Cloud/Orb System --------------
    let shells = [];
    let currentPalette = null;
    let usingCustomPalette = false;
    let customPalette = ["#36a7e9", "#d067db", "#ffe844"]; // Will be updated from config
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let audioSource = null;
    let bassAmplitude = 0;
    let bloomEnabled = true;

    const sphereGeom = new THREE.IcosahedronGeometry(1, 2);
    // Group for the entire orb, for global rotation/transform
    const orbGroup = new THREE.Group();
    const cloudRoot = new THREE.Group();
    orbGroup.add(cloudRoot);
    scene.add(orbGroup);

    // For global orb rotation:
    let orbRotAngle = 0;
    let orbRotRate = 0.30;
    let orbRotDir = 1;
    let orbMotionType = "steady";
    let orbMotionState = { phase:0, timer:0, extra: 0 };

    function makeEmissiveMaterial(color, emissiveIntensity) {
      return new THREE.MeshStandardMaterial({
        color: color,
        emissive: color.clone(),
        emissiveIntensity: emissiveIntensity,
        roughness: 0.25,
        metalness: 0.10,
        vertexColors: true
      });
    }
    function clearShells() {
      for (const sh of shells) {
        if (sh.inst?.material) sh.inst.material.dispose();
        if (sh.trailInst?.material) sh.trailInst.material.dispose();
        sh.group?.remove(sh.inst);
        sh.group?.remove(sh.trailInst);
        cloudRoot.remove(sh.group);
      }
      shells = [];
      while (cloudRoot.children.length) cloudRoot.remove(cloudRoot.children[0]);
    }

    // --- PALETTE ---
    function paletteColorArray() {
      if (usingCustomPalette) {
        return [
          hexToColor(customPalette[0]),
          hexToColor(customPalette[1]),
          hexToColor(customPalette[2])
        ];
      }
      return [
        hexToColor(currentPalette.c1),
        hexToColor(currentPalette.c2),
        hexToColor(currentPalette.c3)
      ];
    }

    // --- REBUILD ---
    function rebuildShells(seed = Math.floor(Math.random() * 1e9)) {
      clearShells();
      const rng = mulberry32(seed);

      const layerCount = config.layers;
      const density = config.density;
      const baseRadius = config.baseRadius;
      const radiusStep = config.radiusStep;
      const thickness = config.thickness;
      const sizeMin = config.sizeMin;
      const sizeMax = config.sizeMax;
      const sizeCurve = config.sizeCurve;
      const palette = paletteColorArray();
      const colorJitter = config.colorJitter;
      const emissiveIntensity = config.emissive;

      bassAmplitude = 0;

      for (let i = 0; i < layerCount; i++) {
        const shellGroup = new THREE.Group();
        const radius = baseRadius + i * radiusStep;
        const radiusJ = radius * (1 + (rng() - 0.5) * 0.08);
        const thickJ  = thickness * (1 + (rng() - 0.5) * 0.25);

        const axis = randomUnitVector(rng).normalize();
        const layerRotationRate = getLayerRotationRate(i);
        const layerRotationDirection = getLayerRotationDirection(i);
        const speed = layerRotationRate * layerRotationDirection;

        const matColor = mixPalette(rng, palette, 0.15);
        const material = makeEmissiveMaterial(matColor, emissiveIntensity);

        const inst = new THREE.InstancedMesh(sphereGeom, material, density);
        inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

        const colors = new Float32Array(density * 3);
        const dummy = new THREE.Object3D();

        for (let j = 0; j < density; j++) {
          const pos = sampleShellPosition(rng, radiusJ, thickJ);
          const t = Math.pow(rng(), sizeCurve);
          const s = lerp(sizeMin, sizeMax, t);

          dummy.position.copy(pos);
          dummy.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          inst.setMatrixAt(j, dummy.matrix);
          const c = mixPalette(rng, palette, colorJitter);
          colors[j * 3 + 0] = c.r;
          colors[j * 3 + 1] = c.g;
          colors[j * 3 + 2] = c.b;
        }
        inst.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
        inst.frustumCulled = false;
        shellGroup.add(inst);

        // Trails
        const trailMaterial = makeEmissiveMaterial(matColor, emissiveIntensity * 0.4);
        trailMaterial.transparent = true;
        trailMaterial.opacity = 0.6;

        const maxTrailLength = 20;
        const trailInst = new THREE.InstancedMesh(sphereGeom, trailMaterial, density * maxTrailLength);
        trailInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

        const trailColors = new Float32Array(density * maxTrailLength * 3);
        trailInst.instanceColor = new THREE.InstancedBufferAttribute(trailColors, 3);
        trailInst.frustumCulled = false;
        trailInst.visible = true;

        shellGroup.add(trailInst);
        cloudRoot.add(shellGroup);

        const trailPositions = [];
        for (let j = 0; j < density; j++) trailPositions.push([]);

        shells.push({
          group: shellGroup,
          inst, trailInst, axis, speed,
          angle: rng() * Math.PI * 2,
          spin: (rng() < 0.5 ? -1 : 1) * (0.08 + rng() * 0.12),
          baseRadius: radiusJ,
          originalBaseRadius: radiusJ,
          layerIndex: i,
          rotationRate: layerRotationRate,
          rotationDirection: layerRotationDirection,
          trailPositions
        });
      }
    }

    // ---- Configuration object (replaces UI DOM references) ----
    const config = {
      layers: 4,
      density: 420,
      baseRadius: 3.2,
      radiusStep: 1.6,
      thickness: 0.45,
      sizeMin: 0.05,
      sizeMax: 0.22,
      sizeCurve: 1.6,
      colorTheme: "random",
      paletteMode: "analogous",
      warmCoolLock: "any",
      colorJitter: 0.35,
      emissive: 3.8,
      customColor1: "#36a7e9",
      customColor2: "#d067db",
      customColor3: "#ffe844",
      bgMode: "solid",
      bgColorSolid: "#05060a",
      bgColorLinStart: "#05060a",
      bgColorLinEnd: "#24316c",
      bgLinearDir: "to bottom",
      bgColorRadialCenter: "#163456",
      bgColorRadialOuter: "#05060a",
      trailEnabled: true,
      trailLength: 8,
      trailFade: 0.3,
      bStrength: 1.2,
      bRadius: 0.4,
      bThreshold: 0.15,
      bloomEnabled: true,
      orbRotRate: 0.30,
      orbRotDir: 1,
      orbMotionType: "steady",
      audioEnabled: false,
      bassSensitivity: 2.0,
      radiusScaleRange: 1.5,
      // Layer-specific configs (will be populated dynamically)
      layerRates: {},
      layerDirs: {}
    };
    
    // Initialize layer configs with defaults
    for (let i = 0; i < 8; i++) {
      config.layerRates[i] = 0.65;
      config.layerDirs[i] = 1;
    }
    
    // Initialize customPalette from config
    customPalette = [config.customColor1, config.customColor2, config.customColor3];
    
    function getLayerRotationRate(layerIndex) {
      return config.layerRates[layerIndex] || 0.65;
    }
    
    function getLayerRotationDirection(layerIndex) {
      return config.layerDirs[layerIndex] || 1;
    }
    
    // BroadcastChannel for control messages
    let controlsChannel = null;
    
    // Set up BroadcastChannel listener
    try {
      controlsChannel = new BroadcastChannel('visualizer-controls');
      controlsChannel.onmessage = handleControlMessage;
    } catch (e) {
      console.warn('BroadcastChannel not available:', e);
    }
    
    function handleControlMessage(event) {
      if (!event.data || event.data.type !== 'PARAM_CHANGE') return;
      
      const { param, value } = event.data;
      
      // Update config based on parameter name
      if (param in config) {
        config[param] = value;
      } else if (param.startsWith('layerRate')) {
        const layerIndex = parseInt(param.replace('layerRate', ''), 10);
        if (!isNaN(layerIndex)) {
          config.layerRates[layerIndex] = parseFloat(value);
          // Update shell if it exists
          if (shells[layerIndex]) {
            shells[layerIndex].rotationRate = config.layerRates[layerIndex];
            shells[layerIndex].speed = shells[layerIndex].rotationRate * shells[layerIndex].rotationDirection;
          }
        }
      } else if (param.startsWith('layerDir')) {
        const layerIndex = parseInt(param.replace('layerDir', ''), 10);
        if (!isNaN(layerIndex)) {
          config.layerDirs[layerIndex] = parseFloat(value);
          // Update shell if it exists
          if (shells[layerIndex]) {
            shells[layerIndex].rotationDirection = config.layerDirs[layerIndex];
            shells[layerIndex].speed = shells[layerIndex].rotationRate * shells[layerIndex].rotationDirection;
          }
        }
      } else if (param === 'rebuild') {
        rebuildShells();
      } else if (param === 'newPalette') {
        usingCustomPalette = false;
        generateNewPalette();
        rebuildShells();
      } else if (param === 'applyCustomPalette') {
        usingCustomPalette = true;
        customPalette = value;
        config.customColor1 = value[0];
        config.customColor2 = value[1];
        config.customColor3 = value[2];
        rebuildShells();
      } else if (param === 'customColor1' || param === 'customColor2' || param === 'customColor3') {
        // Update custom palette when individual colors change
        if (usingCustomPalette) {
          customPalette = [config.customColor1, config.customColor2, config.customColor3];
        }
      } else if (param === 'applyBackground') {
        applyBackgroundFromConfig();
      } else if (param === 'bgMode') {
        config.bgMode = value;
        applyBackgroundFromConfig();
      } else if (param === 'startAudio') {
        // Capture is owned by the front-page audio switch.
      }
      
      // Handle rebuild triggers
      const rebuildParams = ['layers', 'density', 'baseRadius', 'radiusStep', 'thickness', 
                            'sizeMin', 'sizeMax', 'sizeCurve', 'colorJitter', 
                            'paletteMode', 'warmCoolLock', 'colorTheme'];
      if (rebuildParams.includes(param)) {
        if (param === 'paletteMode' || param === 'warmCoolLock' || param === 'colorTheme') {
          if (param === 'colorTheme') usingCustomPalette = false;
          generateNewPalette();
        }
        rebuildShells();
      }
      
      // Handle bloom/emissive transitions
      if (param === 'bStrength' || param === 'bRadius' || param === 'bThreshold') {
        applyBloomTargets();
      }
      if (param === 'emissive') {
        transitions.emissiveIntensity.target = parseFloat(value);
      }
      if (param === 'bloomEnabled') {
        bloomEnabled = value;
      }
      
      // Handle orb motion
      if (param === 'orbRotRate') {
        orbRotRate = parseFloat(value);
      }
      if (param === 'orbRotDir') {
        orbRotDir = parseInt(value, 10);
      }
      if (param === 'orbMotionType') {
        orbMotionType = value;
        orbMotionState = { phase: 0, timer: 0, extra: 0 };
      }
    }

    // ---------- Transitions and bloom master enable ----------
    const transitions = {
      bloomStrength: { current: 1.2, target: 1.2, speed: 0.15 },
      bloomRadius: { current: 0.4, target: 0.4, speed: 0.15 },
      bloomThreshold: { current: 0.15, target: 0.15, speed: 0.15 },
      emissiveIntensity: { current: 3.8, target: 3.8, speed: 0.12 }
    };
    function updateTransitions(dt) {
      const transitionRate = 5.0;
      for (const key in transitions) {
        const trans = transitions[key];
        const diff = trans.target - trans.current;
        if (Math.abs(diff) > 0.001) {
          trans.current += diff * Math.min(1, (dt * trans.speed) / transitionRate);
        } else trans.current = trans.target;
      }
    }
    function applyBloomTargets() {
      transitions.bloomStrength.target = config.bStrength;
      transitions.bloomRadius.target = config.bRadius;
      transitions.bloomThreshold.target = config.bThreshold;
    }
    function applyTransitions() {
      bloomPass.strength = bloomEnabled ? transitions.bloomStrength.current : 0.0;
      bloomPass.radius = transitions.bloomRadius.current;
      bloomPass.threshold = transitions.bloomThreshold.current;
      if (Math.abs(transitions.emissiveIntensity.current - transitions.emissiveIntensity.target) > 0.01) {
        for (const sh of shells) {
          if (sh.inst?.material) sh.inst.material.emissiveIntensity = transitions.emissiveIntensity.current;
          if (sh.trailInst?.material) sh.trailInst.material.emissiveIntensity = transitions.emissiveIntensity.current * 0.4;
        }
      }
    }

    // Helper to create gradient texture
    function createGradientTexture(type, color1, color2, direction = 'to bottom') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      
      const col1 = new THREE.Color(color1);
      const col2 = new THREE.Color(color2);
      
      if (type === 'linear') {
        let x0 = 0, y0 = 0, x1 = 0, y1 = 512;
        if (direction === 'to top') { y0 = 512; y1 = 0; }
        else if (direction === 'to left') { x0 = 512; x1 = 0; }
        else if (direction === 'to right') { x0 = 0; x1 = 512; }
        else if (direction === '135deg') { x0 = 0; y0 = 512; x1 = 512; y1 = 0; }
        else if (direction === '225deg') { x0 = 512; y0 = 512; x1 = 0; y1 = 0; }
        else if (direction === '315deg') { x0 = 512; y0 = 0; x1 = 0; y1 = 512; }
        else if (direction === '45deg') { x0 = 0; y0 = 0; x1 = 512; y1 = 512; }
        
        const gradient = ctx.createLinearGradient(x0, y0, x1, y1);
        gradient.addColorStop(0, `rgb(${Math.round(col1.r*255)}, ${Math.round(col1.g*255)}, ${Math.round(col1.b*255)})`);
        gradient.addColorStop(1, `rgb(${Math.round(col2.r*255)}, ${Math.round(col2.g*255)}, ${Math.round(col2.b*255)})`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
      } else { // radial
        const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        gradient.addColorStop(0, `rgb(${Math.round(col1.r*255)}, ${Math.round(col1.g*255)}, ${Math.round(col1.b*255)})`);
        gradient.addColorStop(1, `rgb(${Math.round(col2.r*255)}, ${Math.round(col2.g*255)}, ${Math.round(col2.b*255)})`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
      }
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }
    
    function applyBackgroundFromConfig() {
      // Dispose of old texture if it exists
      if (scene.background && scene.background.isTexture) {
        scene.background.dispose();
      }
      
      if(config.bgMode === 'solid'){
        const color = new THREE.Color(config.bgColorSolid);
        scene.background = color;
        document.body.style.background = config.bgColorSolid;
      }else if(config.bgMode === 'linear'){
        const texture = createGradientTexture('linear', config.bgColorLinStart, config.bgColorLinEnd, config.bgLinearDir);
        scene.background = texture;
        document.body.style.background = 
          `linear-gradient(${config.bgLinearDir}, ${config.bgColorLinStart}, ${config.bgColorLinEnd})`;
      }else{
        const texture = createGradientTexture('radial', config.bgColorRadialCenter, config.bgColorRadialOuter);
        scene.background = texture;
        document.body.style.background = 
          `radial-gradient(circle, ${config.bgColorRadialCenter} 0%, ${config.bgColorRadialOuter} 100%)`;
      }
    }
    
    // Themes
    const colorThemes = {
      ocean:    { baseHue: 200, paletteMode: "analogous",     warmCoolLock: "cool", minSat: 60, maxSat: 100, minLight: 30, maxLight: 60 },
      sunset:   { baseHue: 15,  paletteMode: "analogous",     warmCoolLock: "warm", minSat: 70, maxSat: 100, minLight: 40, maxLight: 70 },
      forest:   { baseHue: 120, paletteMode: "analogous",     warmCoolLock: "cool", minSat: 50, maxSat: 90,  minLight: 25, maxLight: 50 },
      aurora:   { baseHue: 180, paletteMode: "triadic",       warmCoolLock: "cool", minSat: 70, maxSat: 100, minLight: 35, maxLight: 65 },
      fire:     { baseHue: 0,   paletteMode: "analogous",     warmCoolLock: "warm", minSat: 80, maxSat: 100, minLight: 40, maxLight: 70 },
      lavender: { baseHue: 270, paletteMode: "analogous",     warmCoolLock: "any",  minSat: 50, maxSat: 80,  minLight: 40, maxLight: 70 },
      mint:     { baseHue: 150, paletteMode: "complementary", warmCoolLock: "cool", minSat: 60, maxSat: 90,  minLight: 40, maxLight: 70 },
      coral:    { baseHue: 350, paletteMode: "analogous",     warmCoolLock: "warm", minSat: 70, maxSat: 100, minLight: 45, maxLight: 75 },
      cyber:    { baseHue: 240, paletteMode: "triadic",       warmCoolLock: "cool", minSat: 80, maxSat: 100, minLight: 30, maxLight: 60 },
      golden:   { baseHue: 45,  paletteMode: "analogous",     warmCoolLock: "warm", minSat: 70, maxSat: 100, minLight: 45, maxLight: 75 },
      plum:     { baseHue: 300, paletteMode: "complementary", warmCoolLock: "any",  minSat: 60, maxSat: 90,  minLight: 35, maxLight: 65 },
      teal:     { baseHue: 175, paletteMode: "triadic",       warmCoolLock: "cool", minSat: 65, maxSat: 95,  minLight: 35, maxLight: 65 }
    };
    function generateNewPalette() {
      const themeName = config.colorTheme;
      if (themeName === "random") {
        currentPalette = generatePalette({
          paletteMode: config.paletteMode,
          warmCoolLock: config.warmCoolLock,
          baseHue: null,
          minSaturation: 50,
          maxSaturation: 100,
          minLightness: 30,
          maxLightness: 70,
          ensureContrast: Math.random() > 0.5
        });
      } else {
        const theme = colorThemes[themeName];
        currentPalette = generatePalette({
          paletteMode: theme.paletteMode,
          warmCoolLock: theme.warmCoolLock,
          baseHue: theme.baseHue,
          minSaturation: theme.minSat,
          maxSaturation: theme.maxSat,
          minLightness: theme.minLight,
          maxLightness: theme.maxLight,
          ensureContrast: true
        });
      }
    }

    // --------- Audio Reactivity (shared front-page input)
    function analyzeAudio() {
      const bins = window.frissonMedia?.fft?.();
      if (config.audioEnabled && bins && bins.length) {
        const bassEnd = Math.max(1, Math.floor(bins.length * 0.1));
        let bassSum = 0;
        for (let i = 0; i < bassEnd; i++) bassSum += bins[i];
        bassAmplitude = Math.min(1, (bassSum / (bassEnd * 255)) * config.bassSensitivity);
      } else {
        bassAmplitude *= 0.85;
      }
      requestAnimationFrame(analyzeAudio);
    }
    analyzeAudio();

    // ---------- Render loop ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const t = clock.elapsedTime;
      controls.update();
      updateTransitions(dt);
      applyTransitions();

      // GLOBAL ORB MOTION: actual group motion logic
      let globalRate = orbRotRate * orbRotDir;
      // Intermittent & unexpected: modify globalRate or phase/angle based on orbMotionType
      switch(orbMotionType){
        case "steady":
          orbRotAngle += globalRate * dt; break;
        case "surge":
          orbMotionState.timer+=dt;
          if (orbMotionState.timer > 2.0 + Math.random()*2) {
            orbMotionState.extra = 1.5+Math.random();
            orbMotionState.timer = 0;
          }
          let fac = orbMotionState.extra ? (orbMotionState.extra *= 0.9) : 0;
          orbRotAngle += (globalRate + fac)*dt;
          break;
        case "glitch":
          if(Math.random()<0.01) 
            orbRotAngle += (Math.random()-0.5)*8.0; // sudden jump
          orbRotAngle += globalRate*dt;
          break;
        case "stopgo":
          if(Math.floor(t/2)%2===0) orbRotAngle += globalRate*dt;
          break;
        case "random":
          orbRotAngle += globalRate*dt+
            Math.sin(t*2.4+Math.cos(t))*0.25*orbRotDir+
            Math.cos(2.6*t)*0.09*
            (Math.random()<0.5?-1:1);
          break;
      }
      orbGroup.rotation.y = orbRotAngle;
      // Audio-reactive radius scaling
      if (config.audioEnabled && bassAmplitude > 0) {
        const radiusMultiplier = 1 + (bassAmplitude * config.radiusScaleRange);
        for (let i = 0; i < shells.length; i++) {
          const sh = shells[i];
          const originalRadiusForLayer = sh.originalBaseRadius;
          const targetRadius = originalRadiusForLayer * radiusMultiplier;
          sh.baseRadius = lerp(sh.baseRadius, targetRadius, 0.1);
          const scaleFactor = sh.baseRadius / originalRadiusForLayer;
          sh.group.scale.setScalar(scaleFactor);
        }
      } else {
        for (let i = 0; i < shells.length; i++) {
          const sh = shells[i];
          sh.baseRadius = lerp(sh.baseRadius, sh.originalBaseRadius, 0.1);
          const scaleFactor = sh.baseRadius / sh.originalBaseRadius;
          sh.group.scale.setScalar(scaleFactor);
        }
      }
      // Each shell's own axis orbit and local spin
      for (let i = 0; i < shells.length; i++) {
        const sh = shells[i];
        // Update speed from config
        sh.rotationRate = config.layerRates[i] || 0.65;
        sh.rotationDirection = config.layerDirs[i] || 1;
        sh.speed = sh.rotationRate * sh.rotationDirection;
        sh.angle += sh.speed * dt;
        sh.group.quaternion.setFromAxisAngle(sh.axis, sh.angle);
        sh.group.rotateOnAxis(sh.axis, sh.spin * dt * 0.25);
        // Trails
        if (config.trailEnabled && sh.trailInst && sh.trailPositions) {
          const trailLength = config.trailLength;
          const trailFade = config.trailFade;
          const dummy = new THREE.Object3D();
          let trailInstanceIndex = 0;
          const sampleInterval = Math.max(1, Math.floor(60 / (trailLength * 2)));
          const shouldSample = Math.floor(t * 60) % sampleInterval === 0;
          const density = sh.inst.count;
          for (let j = 0; j < density; j++) {
            const mainMatrix = new THREE.Matrix4();
            sh.inst.getMatrixAt(j, mainMatrix);
            const position = new THREE.Vector3();
            const quaternion = new THREE.Quaternion();
            const scale = new THREE.Vector3();
            mainMatrix.decompose(position, quaternion, scale);
            position.applyMatrix4(sh.group.matrixWorld);
            if (!sh.trailPositions[j]) sh.trailPositions[j] = [];
            if (shouldSample || sh.trailPositions[j].length === 0) {
              sh.trailPositions[j].push({
                position: position.clone(),
                scale: scale.clone(),
                color: new THREE.Color(
                  sh.inst.instanceColor.array[j * 3],
                  sh.inst.instanceColor.array[j * 3 + 1],
                  sh.inst.instanceColor.array[j * 3 + 2]
                )
              });
            }
            while (sh.trailPositions[j].length > trailLength) {
              sh.trailPositions[j].shift();
            }
            for (let k = 0; k < sh.trailPositions[j].length; k++) {
              const trailData = sh.trailPositions[j][k];
              const age = k / Math.max(1, sh.trailPositions[j].length - 1);
              const fadeFactor = Math.pow(trailFade, age);
              dummy.position.copy(trailData.position);
              dummy.scale.copy(trailData.scale);
              dummy.updateMatrix();
              sh.trailInst.setMatrixAt(trailInstanceIndex, dummy.matrix);
              // faded color
              sh.trailInst.instanceColor.array[trailInstanceIndex*3] = trailData.color.r*fadeFactor;
              sh.trailInst.instanceColor.array[trailInstanceIndex*3+1]=trailData.color.g*fadeFactor;
              sh.trailInst.instanceColor.array[trailInstanceIndex*3+2]=trailData.color.b*fadeFactor;
              trailInstanceIndex++;
            }
          }
          for (let idx = trailInstanceIndex; idx < sh.trailInst.count; idx++) {
            dummy.scale.setScalar(0);
            dummy.updateMatrix();
            sh.trailInst.setMatrixAt(idx, dummy.matrix);
          }
          sh.trailInst.instanceMatrix.needsUpdate = true;
          sh.trailInst.instanceColor.needsUpdate = true;
          sh.trailInst.visible = true;
        } else if (sh.trailInst) {
          sh.trailInst.visible = false;
        }
      }
      composer.render();
    }

    // ---------- Resize ----------
    window.addEventListener("resize", () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(w, h);
    });

    // ---------- Initial ----------
    usingCustomPalette = false;
    generateNewPalette();
    applyBloomTargets();
    transitions.bloomStrength.current = config.bStrength;
    transitions.bloomStrength.target = config.bStrength;
    transitions.bloomRadius.current = config.bRadius;
    transitions.bloomRadius.target = config.bRadius;
    transitions.bloomThreshold.current = config.bThreshold;
    transitions.bloomThreshold.target = config.bThreshold;
    transitions.emissiveIntensity.current = config.emissive;
    transitions.emissiveIntensity.target = config.emissive;
    orbRotRate = config.orbRotRate;
    orbRotDir = config.orbRotDir;
    orbMotionType = config.orbMotionType;
    bloomEnabled = config.bloomEnabled;
    applyBackgroundFromConfig();
    rebuildShells(1337);
    animate();
    
    // Import module.js for shell integration
    import('./module.js').then(module => {
      console.log('Orbs module.js loaded');
    }).catch(err => {
      console.warn('Could not load module.js:', err);
    });
  </script>
</body>
</html>
