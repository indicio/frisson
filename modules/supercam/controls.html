<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supercam Controls</title>
  <link rel="stylesheet" href="../../shared/ui.css">
  <style>
    
    .mode-controls {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }
  </style>
  <link rel="stylesheet" href="../../shared/controls.css">
</head>
<body class="frisson-controls">
  <div class="control-panel">
    <header class="controls-heading"><p>Frisson / Controls</p><h1>Supercam</h1></header>
    
    <div class="controls-grid">
      <div class="controls-column">
        <div class="control-group">
          <h3>Global Settings</h3>
          
          <div class="control-item">
            <label class="control-label">
              Master Audio Sensitivity
              <span class="value" id="audioSensitivityValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="audioSensitivity" 
              min="0" 
              max="2" 
              step="0.1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Global Effect Intensity
              <span class="value" id="globalIntensityValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="globalIntensity" 
              min="0" 
              max="1" 
              step="0.01" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Brightness
              <span class="value" id="globalBrightnessValue">0.0</span>
            </label>
            <input 
              type="range" 
              id="globalBrightness" 
              min="-0.5" 
              max="0.5" 
              step="0.01" 
              value="0"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Contrast
              <span class="value" id="globalContrastValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="globalContrast" 
              min="0.5" 
              max="2" 
              step="0.1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Blend With Original
              <span class="value" id="globalBlendValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="globalBlend" 
              min="0" 
              max="1" 
              step="0.01" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Blur
              <span class="value" id="globalBlurValue">0.0</span>
            </label>
            <input 
              type="range" 
              id="globalBlur" 
              min="0" 
              max="10" 
              step="0.1" 
              value="0"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">Mode</label>
            <select id="modeSelect">
              <option value="0">Kaleidoscope</option>
              <option value="1">Glitch/Datamosh</option>
              <option value="2">Gradient Map</option>
              <option value="3">Camera Shake</option>
            </select>
          </div>
        </div>
        
        <!-- Mode 0: Kaleidoscope -->
        <div id="mode0-controls" class="control-group mode-controls">
          <h3>Kaleidoscope</h3>
          
          <div class="control-item">
            <label class="control-label">
              Segments
              <span class="value" id="kaleidSegmentsValue">6</span>
            </label>
            <input 
              type="range" 
              id="kaleidSegments" 
              min="2" 
              max="12" 
              step="1" 
              value="6"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Subdivisions
              <span class="value" id="kaleidSubdivisionsValue">1</span>
            </label>
            <input 
              type="range" 
              id="kaleidSubdivisions" 
              min="1" 
              max="8" 
              step="1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Mirror Strength
              <span class="value" id="kaleidMirrorStrengthValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="kaleidMirrorStrength" 
              min="0" 
              max="1" 
              step="0.01" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Zoom
              <span class="value" id="kaleidZoomValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="kaleidZoom" 
              min="0.5" 
              max="2" 
              step="0.1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Rotation Speed
              <span class="value" id="kaleidRotationSpeedValue">0.0</span>
            </label>
            <input 
              type="range" 
              id="kaleidRotationSpeed" 
              min="0" 
              max="2" 
              step="0.1" 
              value="0"
            >
          </div>
        </div>
        
        <!-- Mode 1: Glitch/Datamosh -->
        <div id="mode1-controls" class="control-group mode-controls" style="display: none;">
          <h3>Glitch/Datamosh</h3>
          
          <div class="control-item">
            <label class="control-label">
              Base Intensity
              <span class="value" id="glitchBaseIntensityValue">0.3</span>
            </label>
            <input 
              type="range" 
              id="glitchBaseIntensity" 
              min="0" 
              max="1" 
              step="0.01" 
              value="0.3"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Max Pixel Size
              <span class="value" id="glitchMaxPixelSizeValue">8</span>
            </label>
            <input 
              type="range" 
              id="glitchMaxPixelSize" 
              min="1" 
              max="20" 
              step="1" 
              value="8"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              RGB Offset Amount
              <span class="value" id="glitchRGBOffsetValue">0.01</span>
            </label>
            <input 
              type="range" 
              id="glitchRGBOffset" 
              min="0" 
              max="0.02" 
              step="0.001" 
              value="0.01"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Glitch Threshold
              <span class="value" id="glitchThresholdValue">0.5</span>
            </label>
            <input 
              type="range" 
              id="glitchThreshold" 
              min="0" 
              max="1" 
              step="0.01" 
              value="0.5"
            >
          </div>
        </div>
      </div>
      
      <div class="controls-column">
        <!-- Mode 2: Gradient Map -->
        <div id="mode2-controls" class="control-group mode-controls" style="display: none;">
          <h3>Gradient Map</h3>
          
          <div class="control-item">
            <label class="control-label">Gradient Preset</label>
            <select id="gradientPreset">
              <option value="custom">Custom</option>
              <option value="warmNeon">Warm Neon</option>
              <option value="coldSynthwave">Cold Synthwave</option>
              <option value="duotone">Duotone</option>
              <option value="fire">Fire</option>
              <option value="ocean">Ocean</option>
            </select>
          </div>
          
          <div class="control-item">
            <label class="control-label">Gradient Stop 1 (Dark)</label>
            <input type="color" id="gradientColor1" value="#000000">
            <span class="value" id="gradientColor1-value">#000000</span>
          </div>
          
          <div class="control-item">
            <label class="control-label">Gradient Stop 2 (Mid)</label>
            <input type="color" id="gradientColor2" value="#808080">
            <span class="value" id="gradientColor2-value">#808080</span>
          </div>
          
          <div class="control-item">
            <label class="control-label">Gradient Stop 3 (Light)</label>
            <input type="color" id="gradientColor3" value="#ffffff">
            <span class="value" id="gradientColor3-value">#ffffff</span>
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Gradient Contrast
              <span class="value" id="gradientContrastValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="gradientContrast" 
              min="0.5" 
              max="2" 
              step="0.1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Gradient Brightness
              <span class="value" id="gradientBrightnessValue">0.0</span>
            </label>
            <input 
              type="range" 
              id="gradientBrightness" 
              min="-0.3" 
              max="0.3" 
              step="0.01" 
              value="0"
            >
          </div>
        </div>
        
        <!-- Mode 3: Camera Shake -->
        <div id="mode3-controls" class="control-group mode-controls" style="display: none;">
          <h3>Camera Shake</h3>
          
          <div class="control-item">
            <label class="control-label">
              Max Shake Position
              <span class="value" id="shakeMaxPositionValue">0.02</span>
            </label>
            <input 
              type="range" 
              id="shakeMaxPosition" 
              min="0" 
              max="0.05" 
              step="0.001" 
              value="0.02"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Max Shake Rotation
              <span class="value" id="shakeMaxRotationValue">0.1</span>
            </label>
            <input 
              type="range" 
              id="shakeMaxRotation" 
              min="0" 
              max="0.2" 
              step="0.01" 
              value="0.1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Shake Smoothness
              <span class="value" id="shakeSmoothnessValue">0.7</span>
            </label>
            <input 
              type="range" 
              id="shakeSmoothness" 
              min="0" 
              max="1" 
              step="0.01" 
              value="0.7"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Audio Sensitivity
              <span class="value" id="shakeAudioSensitivityValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="shakeAudioSensitivity" 
              min="0" 
              max="3" 
              step="0.1" 
              value="1"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Color Refraction Amount
              <span class="value" id="shakeRefractionAmountValue">0.0</span>
            </label>
            <input 
              type="range" 
              id="shakeRefractionAmount" 
              min="0" 
              max="0.02" 
              step="0.001" 
              value="0"
            >
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Refraction Intensity
              <span class="value" id="shakeRefractionIntensityValue">1.0</span>
            </label>
            <input 
              type="range" 
              id="shakeRefractionIntensity" 
              min="0" 
              max="2" 
              step="0.1" 
              value="1"
            >
          </div>
        </div>
        
        <div class="control-group favorites-section">
          <h3>⭐ Favorites</h3>
          
          <div class="favorites-input-group">
            <input 
              type="text" 
              id="favoriteName" 
              placeholder="Favorite name"
              class="control-input"
             aria-label="Favorite name">
            <button id="saveFavoriteBtn" class="btn primary">Save favorite</button>
          </div>
          
          <div id="favoritesList" class="favorites-list"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module" src="./controls.js"></script>
  <script type="module" src="../../shared/controlsUI.js"></script>
</body>
</html>
