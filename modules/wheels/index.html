<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio-Reactive Orbiting Wheels - 3D Orbit & Tunnel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050509;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <script src="../../shared/libs/three-r160/three.min.js"></script>
  <script type="module" src="../../shared/mediaFeed.js"></script>
  <script>
    let scene, camera, renderer;
    let clock, prevElapsed = 0;

    const wheels = []; // { id, group, params, uiRoot, ui, basePosition, driftPhase, spinOffset, baseHue, ageFade }

    let wheelIdCounter = 1;

    // Master parameters
    const masterParams = {
      palette: 'rainbow',
      layoutMode: 'free',
      alignedOffset: 4,
      audioSensitivity: 1.0,
      spinMultiplier: 1.0,
      driftMultiplier: 1.0,
      globalScale: 1.0,
      discCountMultiplier: 1.0,
      discSizeMultiplier: 1.0,
      glowStrength: 0.8,
      opacityEffect: 1.0,
      // Orbit
      orbitDepth: 6,
      orbitRadiusMult: 1.0,
      orbitSpeed: 0.25,
      orbitTiltX: 15 * Math.PI / 180,
      orbitTiltY: 20 * Math.PI / 180,
      // Tunnel
      tunnelDepth: 80,
      tunnelSpeed: 5,
      // Camera
      cameraMode: 'static',
      cameraOrbitSpeed: 0.12,
      cameraDollyAmount: 0.6,
      // Driver
      driverRate: 1.0
    };

    // Driver system: tracks which controls have drivers enabled
    const drivers = {
      alignedOffset: { enabled: false, input: null, valueSpan: null, min: 0, max: 20, step: 0.5, paramKey: 'alignedOffset' },
      cameraOrbitSpeed: { enabled: false, input: null, valueSpan: null, min: 0, max: 0.5, step: 0.01, paramKey: 'cameraOrbitSpeed' },
      cameraDollyAmount: { enabled: false, input: null, valueSpan: null, min: 0, max: 1, step: 0.05, paramKey: 'cameraDollyAmount' },
      orbitDepth: { enabled: false, input: null, valueSpan: null, min: 0, max: 30, step: 0.5, paramKey: 'orbitDepth' },
      orbitRadiusMult: { enabled: false, input: null, valueSpan: null, min: 0.3, max: 2, step: 0.05, paramKey: 'orbitRadiusMult' },
      orbitSpeed: { enabled: false, input: null, valueSpan: null, min: 0, max: 1, step: 0.02, paramKey: 'orbitSpeed' },
      orbitTiltX: { enabled: false, input: null, valueSpan: null, min: -90, max: 90, step: 1, paramKey: 'orbitTiltX', isAngle: true },
      orbitTiltY: { enabled: false, input: null, valueSpan: null, min: -90, max: 90, step: 1, paramKey: 'orbitTiltY', isAngle: true },
      tunnelDepth: { enabled: false, input: null, valueSpan: null, min: 20, max: 200, step: 5, paramKey: 'tunnelDepth' },
      tunnelSpeed: { enabled: false, input: null, valueSpan: null, min: 0, max: 20, step: 0.5, paramKey: 'tunnelSpeed' },
      masterAudioSens: { enabled: false, input: null, valueSpan: null, min: 0, max: 2, step: 0.05, paramKey: 'audioSensitivity' },
      masterSpinMult: { enabled: false, input: null, valueSpan: null, min: 0, max: 2, step: 0.05, paramKey: 'spinMultiplier' },
      masterDriftMult: { enabled: false, input: null, valueSpan: null, min: 0, max: 2, step: 0.05, paramKey: 'driftMultiplier' },
      masterGlobalScale: { enabled: false, input: null, valueSpan: null, min: 0.5, max: 2, step: 0.05, paramKey: 'globalScale' },
      masterDiscCountMult: { enabled: false, input: null, valueSpan: null, min: 0.25, max: 2, step: 0.05, paramKey: 'discCountMultiplier' },
      masterDiscSizeMult: { enabled: false, input: null, valueSpan: null, min: 0.25, max: 2, step: 0.05, paramKey: 'discSizeMultiplier' },
      masterGlowStrength: { enabled: false, input: null, valueSpan: null, min: 0, max: 1, step: 0.05, paramKey: 'glowStrength' },
      masterOpacityEffect: { enabled: false, input: null, valueSpan: null, min: 0, max: 2, step: 0.05, paramKey: 'opacityEffect' }
    };

    // Audio state
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let audioReady = false;

    let audioLevelBass = 0;
    let audioLevelMid = 0;
    let audioLevelTreble = 0;

    // Tunnel scroll state
    let tunnelOffset = 0;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
      camera.position.set(0, 0, 30);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x050509, 1);
      document.body.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      clock = new THREE.Clock();

      // Start with one wheel
      addWheel();

      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }


    function updateDrivers(elapsed) {
      // Update all enabled drivers
      Object.keys(drivers).forEach(key => {
        const driver = drivers[key];
        if (!driver.enabled || !driver.input) return;

        const { min, max, step } = driver;
        const range = max - min;
        const t = (Math.sin(elapsed * masterParams.driverRate) + 1) / 2; // 0 to 1
        const value = min + t * range;
        
        // Round to step
        const roundedValue = Math.round(value / step) * step;
        
        // Update UI - this will trigger input handlers which update masterParams
        driver.input.value = roundedValue;
        
        // Manually trigger input event to ensure handlers fire
        driver.input.dispatchEvent(new Event('input'));
      });
    }

    function updateWheelAgeFades() {
      const n = wheels.length;
      const step = 0.2;
      for (let i = 0; i < n; i++) {
        const wheel = wheels[i];
        const rankFromNewest = (n - 1 - i); // 0 for newest
        let fade = 1 - rankFromNewest * step;
        if (fade < 0.2) fade = 0.2;
        wheel.ageFade = fade;
      }
    }

    function addWheel() {
      const id = wheelIdCounter++;
      const group = new THREE.Group();
      scene.add(group);

      const basePosition = {
        x: (Math.random() - 0.5) * 22,
        y: (Math.random() - 0.5) * 16
      };
      const driftPhase = Math.random() * Math.PI * 2;
      const spinOffset = Math.random() * Math.PI * 2;
      const baseHue = Math.random();

      const params = {
        discCount: 16,
        discRadius: 0.6,
        wheelRadius: 8,
        spinSpeed: 0.5,
        spinDirection: 1,
        driftStrength: 0.6,
        audioSensitivity: 1.0
      };

      const wheel = {
        id,
        group,
        params,
        basePosition,
        driftPhase,
        spinOffset,
        baseHue,
        uiRoot: null,
        ui: {},
        ageFade: 1
      };

      wheels.push(wheel);
      updateWheelAgeFades();

      rebuildWheelGeometry(wheel);
    }

    function removeWheel(wheel) {
      if (wheel.group && wheel.group.parent) {
        wheel.group.parent.remove(wheel.group);
      }
      wheel.group.traverse(obj => {
        if (obj.isMesh) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        }
      });

      const idx = wheels.indexOf(wheel);
      if (idx !== -1) wheels.splice(idx, 1);

      updateWheelAgeFades();
    }


    function getDiscColorForPalette(palette, baseHue, index, count) {
      const color = new THREE.Color();
      let hue = baseHue;
      let sat = 0.7;
      let light = 0.55;

      switch (palette) {
        case 'rainbow':
          hue = (index / count) % 1;
          break;
        case 'mono':
          hue = baseHue;
          break;
        case 'complementary':
          hue = (index % 2 === 0 ? baseHue : (baseHue + 0.5)) % 1;
          break;
        case 'triad': {
          const triadIndex = index % 3;
          hue = (baseHue + triadIndex * (1 / 3)) % 1;
          break;
        }
        case 'analogWarm': {
          const offset = (index / Math.max(1, count - 1)) * 0.15 - 0.075;
          hue = (baseHue + offset + 1.0) % 1;
          break;
        }
        case 'analogCool': {
          const offset = (index / Math.max(1, count - 1)) * 0.18 - 0.09;
          hue = (baseHue + offset + 0.5) % 1;
          break;
        }
        case 'randomPerDisc':
          hue = Math.random();
          break;
        case 'fire': {
          const t = index / Math.max(1, count - 1);
          hue = 0.02 + t * 0.12;
          sat = 0.85;
          light = 0.45 + 0.15 * t;
          break;
        }
        case 'ocean': {
          const t = index / Math.max(1, count - 1);
          hue = 0.5 + t * 0.15;
          sat = 0.8;
          light = 0.4 + 0.2 * t;
          break;
        }
        case 'neon': {
          hue = (baseHue + index * 0.13) % 1;
          sat = 1.0;
          light = 0.6 + 0.15 * Math.sin(index);
          break;
        }
        case 'dusk': {
          const t = index / Math.max(1, count - 1);
          hue = (0.72 + t * 0.18) % 1;
          sat = 0.75;
          light = 0.35 + 0.25 * t;
          break;
        }
        case 'frost': {
          const t = index / Math.max(1, count - 1);
          hue = 0.5 + t * 0.1;
          sat = 0.25 + 0.3 * t;
          light = 0.7 + 0.2 * (1 - t);
          break;
        }
        default:
          hue = (index / count) % 1;
      }

      color.setHSL(hue, sat, light);
      return color;
    }

    function rebuildWheelGeometry(wheel) {
      const group = wheel.group;
      const { discCount, discRadius, wheelRadius } = wheel.params;
      const palette = masterParams.palette;
      
      // Apply global multipliers
      const effectiveDiscCount = Math.max(1, Math.floor(discCount * masterParams.discCountMultiplier));
      const effectiveDiscRadius = discRadius * masterParams.discSizeMultiplier;

      const toRemove = group.children.slice();
      toRemove.forEach(child => {
        group.remove(child);
        if (child.isMesh) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
      });

      let finalDiscRadius = effectiveDiscRadius;
      if (effectiveDiscCount > 1 && wheelRadius > 0) {
        const margin = 0.9;
        const maxDiscRadius = wheelRadius * Math.sin(Math.PI / effectiveDiscCount) * margin;
        if (maxDiscRadius > 0) {
          finalDiscRadius = Math.min(effectiveDiscRadius, maxDiscRadius);
        }
      }

      const SEGMENTS = 64;
      const discGeometry = new THREE.CircleGeometry(finalDiscRadius, SEGMENTS);
      const glowGeometry = new THREE.CircleGeometry(finalDiscRadius * 1.7, SEGMENTS);

      for (let i = 0; i < effectiveDiscCount; i++) {
        const angle = (i / effectiveDiscCount) * Math.PI * 2;
        const color = getDiscColorForPalette(palette, wheel.baseHue, i, effectiveDiscCount);

        const discMaterial = new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 1
        });

        const disc = new THREE.Mesh(discGeometry, discMaterial);
        disc.position.set(
          Math.cos(angle) * wheelRadius,
          Math.sin(angle) * wheelRadius,
          0
        );
        disc.userData.isDisc = true;
        group.add(disc);

        const glowMaterial = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: masterParams.glowStrength * 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        glow.position.copy(disc.position);
        glow.userData.isGlow = true;
        group.add(glow);
      }
    }

    function updateAudioBands() {
      const dataArray = window.frissonMedia?.fft?.();
      if (!dataArray || !dataArray.length) {
        audioLevelBass *= 0.8;
        audioLevelMid *= 0.8;
        audioLevelTreble *= 0.8;
        return;
      }
      const len = dataArray.length;

      const bassEnd = Math.floor(len * 0.15);
      const midEnd = Math.floor(len * 0.6);

      let bassSum = 0, midSum = 0, trebleSum = 0;
      let bassCount = 0, midCount = 0, trebleCount = 0;

      for (let i = 0; i < len; i++) {
        const v = dataArray[i];
        if (i < bassEnd) {
          bassSum += v; bassCount++;
        } else if (i < midEnd) {
          midSum += v; midCount++;
        } else {
          trebleSum += v; trebleCount++;
        }
      }

      const bassAvg = bassCount ? bassSum / bassCount : 0;
      const midAvg = midCount ? midSum / midCount : 0;
      const trebleAvg = trebleCount ? trebleSum / trebleCount : 0;

      let bassNorm = bassAvg / 255;
      let midNorm = midAvg / 255;
      let trebleNorm = trebleAvg / 255;

      bassNorm = Math.pow(bassNorm, 1.1);
      midNorm = Math.pow(midNorm, 1.2);
      trebleNorm = Math.pow(trebleNorm, 1.3);

      audioLevelBass = audioLevelBass * 0.8 + bassNorm * 0.2;
      audioLevelMid = audioLevelMid * 0.8 + midNorm * 0.2;
      audioLevelTreble = audioLevelTreble * 0.8 + trebleNorm * 0.2;
    }

    function randomizeAllWheels() {
      wheels.forEach(wheel => {
        const p = wheel.params;

        p.discCount = Math.floor(8 + Math.random() * 40);
        p.discRadius = 0.3 + Math.random() * 1.3;
        p.wheelRadius = 4 + Math.random() * 20;
        p.spinSpeed = Math.random() * 1.5;
        p.spinDirection = Math.random() < 0.5 ? 1 : -1;
        p.driftStrength = Math.random() * 1.5;
        p.audioSensitivity = 0.5 + Math.random() * 1.5;
        wheel.baseHue = Math.random();
        wheel.basePosition = {
          x: (Math.random() - 0.5) * 22,
          y: (Math.random() - 0.5) * 16
        };
        wheel.driftPhase = Math.random() * Math.PI * 2;

        rebuildWheelGeometry(wheel);
      });

      updateWheelAgeFades();
    }

    function animateCamera(elapsed) {
      // Tunnel uses a straight-on camera
      if (masterParams.layoutMode === 'tunnel') {
        camera.position.set(0, 0, 30);
        camera.lookAt(0, 0, 0);
        return;
      }

      const mode = masterParams.cameraMode;
      const baseRadius = 30;
      let radius = baseRadius;

      if (mode === 'static') {
        camera.position.set(0, 0, baseRadius);
        camera.lookAt(0, 0, 0);
        return;
      }

      const angle = elapsed * masterParams.cameraOrbitSpeed;

      if (mode === 'bassDollyOrbit') {
        const factor = 1 + audioLevelBass * masterParams.cameraDollyAmount;
        radius = baseRadius * (0.7 + 0.5 * factor);
      }

      camera.position.x = Math.cos(angle) * radius;
      camera.position.z = Math.sin(angle) * radius;
      camera.position.y = Math.sin(angle * 0.5) * 8;
      camera.lookAt(0, 0, 0);
    }

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const dt = elapsed - prevElapsed;
      prevElapsed = elapsed;

      // Update drivers (sweeping parameters)
      updateDrivers(elapsed);

      if (audioReady) {
        updateAudioBands();
      } else {
        audioLevelBass *= 0.9;
        audioLevelMid *= 0.9;
        audioLevelTreble *= 0.9;
      }

      const n = wheels.length;
      const layout = masterParams.layoutMode;

      if (layout === 'tunnel') {
        tunnelOffset += dt * masterParams.tunnelSpeed;
      }

      wheels.forEach((wheel, index) => {
        const { group, params, basePosition, driftPhase, ageFade } = wheel;
        const { spinSpeed, spinDirection, driftStrength, audioSensitivity } = params;

        const sens = masterParams.audioSensitivity * audioSensitivity;
        const effBass = audioLevelBass * sens;
        const effMid = audioLevelMid * sens;
        const effTreble = audioLevelTreble * sens;

        const spinBoost = 1 + effMid * 1.5;
        const dir = spinDirection * (index % 2 === 0 ? 1 : -1);
        group.rotation.z += dt * spinSpeed * spinBoost * dir * masterParams.spinMultiplier;

        let baseScale;

        if (layout === 'orbit3d') {
          const orbitR = params.wheelRadius * masterParams.orbitRadiusMult;
          const tOrbit = elapsed * masterParams.orbitSpeed + wheel.spinOffset;
          let ox = Math.cos(tOrbit) * orbitR;
          let oy = Math.sin(tOrbit) * orbitR;
          let oz = Math.sin(tOrbit * 0.8 + index) * masterParams.orbitDepth;

          const tx = masterParams.orbitTiltX;
          const ty = masterParams.orbitTiltY;

          let y1 = oy * Math.cos(tx) - oz * Math.sin(tx);
          let z1 = oy * Math.sin(tx) + oz * Math.cos(tx);
          let x1 = ox;

          let x2 = x1 * Math.cos(ty) + z1 * Math.sin(ty);
          let z2 = -x1 * Math.sin(ty) + z1 * Math.cos(ty);

          group.position.set(x2, y1, z2);

          const sizeFactor = Math.max(0.4, 1 - 0.15 * index);
          baseScale = masterParams.globalScale * sizeFactor;

        } else if (layout === 'tunnel') {
          const depth = masterParams.tunnelDepth;
          const spacing = depth / Math.max(1, n);
          let z = -((index * spacing + tunnelOffset) % depth);
          group.position.set(0, 0, z);

          const norm = 1 - Math.min(Math.abs(z) / depth, 1);
          baseScale = masterParams.globalScale * (0.5 + norm * 1.5);

        } else {
          let baseX, baseY;
          if (layout === 'aligned') {
            const centerIndex = (n - 1) / 2;
            baseX = (index - centerIndex) * masterParams.alignedOffset;
            baseY = 0;
          } else {
            baseX = basePosition.x;
            baseY = basePosition.y;
          }

          const t = elapsed + driftPhase;

          if (layout === 'aligned') {
            const driftAmpX = 2 * driftStrength * masterParams.driftMultiplier;
            group.position.x = baseX + Math.sin(t * 0.23) * driftAmpX;
            group.position.y = baseY;
          } else {
            const driftAmpX = 8 * driftStrength * masterParams.driftMultiplier;
            const driftAmpY = 6 * driftStrength * masterParams.driftMultiplier;
            group.position.x = baseX + Math.sin(t * 0.23) * driftAmpX;
            group.position.y = baseY + Math.cos(t * 0.19) * driftAmpY;
          }

          group.position.z = 0;

          if (layout === 'aligned') {
            const sizeFactor = Math.max(0.4, 1 - 0.15 * index);
            baseScale = masterParams.globalScale * sizeFactor;
          } else {
            baseScale = masterParams.globalScale * (1 + index * 0.12);
          }
        }

        const audioScale = baseScale + effBass * 0.9;
        group.scale.set(audioScale, audioScale, 1);

        const opacityIntensity = masterParams.opacityEffect;
        let ageFactor = 1 - (1 - ageFade) * opacityIntensity;
        ageFactor = Math.max(0.05, Math.min(1, ageFactor));
        const glowStrength = masterParams.glowStrength;

        group.children.forEach(child => {
          if (child.userData && child.userData.isGlow && child.material) {
            const minOpacity = glowStrength * 0.2 * ageFactor;
            const twinkle = effTreble * glowStrength * 0.9 * ageFactor * opacityIntensity;
            child.material.opacity = minOpacity + twinkle;
          }

          if (child.userData && child.userData.isDisc && child.material) {
            const baseOpacity = 0.9 * ageFactor;
            const shimmer = effTreble * 0.1 * opacityIntensity;
            const op = Math.min(1, baseOpacity + shimmer);
            child.material.opacity = op;
            child.quaternion.copy(camera.quaternion);
          }
        });
      });

      animateCamera(elapsed);

      renderer.render(scene, camera);
    }

    // --- BROADCASTCHANNEL COMMUNICATION ---
    let controlsChannel = null;

    /**
     * Handle control messages from controls panel
     */
    function handleControlMessage(event) {
      if (event.data.type === 'PARAM_CHANGE') {
        const { param, value } = event.data;
        handleParamChange(param, value);
      }
    }

    /**
     * Handle window messages
     */
    function handleWindowMessage(event) {
      if (event.data.type === 'PARAM_CHANGE') {
        const { param, value } = event.data;
        handleParamChange(param, value);
      }
    }

    /**
     * Handle parameter changes
     */
    function handleParamChange(param, value) {
      switch (param) {
        case 'bgColor':
          const hex = value || '#050509';
          const colorInt = parseInt(hex.replace('#', ''), 16);
          renderer.setClearColor(colorInt, 1);
          break;
        case 'driverRate':
          masterParams.driverRate = parseFloat(value);
          break;
        case 'masterPalette':
          masterParams.palette = value;
          wheels.forEach(w => rebuildWheelGeometry(w));
          break;
        case 'layoutMode':
          masterParams.layoutMode = value;
          updateLayoutVisibility(value);
          break;
        case 'alignedOffset':
          masterParams.alignedOffset = parseFloat(value);
          break;
        case 'cameraMode':
          masterParams.cameraMode = value;
          break;
        case 'cameraOrbitSpeed':
          masterParams.cameraOrbitSpeed = parseFloat(value);
          break;
        case 'cameraDollyAmount':
          masterParams.cameraDollyAmount = parseFloat(value);
          break;
        case 'orbitDepth':
          masterParams.orbitDepth = parseFloat(value);
          break;
        case 'orbitRadiusMult':
          masterParams.orbitRadiusMult = parseFloat(value);
          break;
        case 'orbitSpeed':
          masterParams.orbitSpeed = parseFloat(value);
          break;
        case 'orbitTiltX':
          masterParams.orbitTiltX = parseFloat(value) * Math.PI / 180;
          break;
        case 'orbitTiltY':
          masterParams.orbitTiltY = parseFloat(value) * Math.PI / 180;
          break;
        case 'tunnelDepth':
          masterParams.tunnelDepth = parseFloat(value);
          break;
        case 'tunnelSpeed':
          masterParams.tunnelSpeed = parseFloat(value);
          break;
        case 'masterAudioSens':
          masterParams.audioSensitivity = parseFloat(value);
          break;
        case 'masterSpinMult':
          masterParams.spinMultiplier = parseFloat(value);
          break;
        case 'masterDriftMult':
          masterParams.driftMultiplier = parseFloat(value);
          break;
        case 'masterGlobalScale':
          masterParams.globalScale = parseFloat(value);
          break;
        case 'masterDiscCountMult':
          masterParams.discCountMultiplier = parseFloat(value);
          wheels.forEach(w => rebuildWheelGeometry(w));
          break;
        case 'masterDiscSizeMult':
          masterParams.discSizeMultiplier = parseFloat(value);
          wheels.forEach(w => rebuildWheelGeometry(w));
          break;
        case 'masterGlowStrength':
          masterParams.glowStrength = parseFloat(value);
          wheels.forEach(w => {
            w.group.children.forEach(child => {
              if (child.userData && child.userData.isGlow && child.material) {
                child.material.opacity = masterParams.glowStrength * 0.4;
              }
            });
          });
          break;
        case 'masterOpacityEffect':
          masterParams.opacityEffect = parseFloat(value);
          break;
        case 'masterRandomize':
          randomizeAllWheels();
          // Also randomize some master params
          masterParams.alignedOffset = 2 + Math.random() * 18;
          masterParams.audioSensitivity = Math.random() * 2;
          masterParams.spinMultiplier = 0.5 + Math.random() * 1.5;
          masterParams.driftMultiplier = 0.5 + Math.random() * 1.5;
          masterParams.globalScale = 0.5 + Math.random() * 1.5;
          masterParams.discCountMultiplier = 0.5 + Math.random() * 1.5;
          masterParams.discSizeMultiplier = 0.5 + Math.random() * 1.5;
          masterParams.glowStrength = 0.3 + Math.random() * 0.7;
          masterParams.opacityEffect = Math.random() * 2;
          masterParams.orbitDepth = Math.random() * 30;
          masterParams.orbitRadiusMult = 0.5 + Math.random() * 1.5;
          masterParams.orbitSpeed = Math.random();
          masterParams.orbitTiltX = (Math.random() - 0.5) * Math.PI;
          masterParams.orbitTiltY = (Math.random() - 0.5) * Math.PI;
          masterParams.tunnelDepth = 30 + Math.random() * 170;
          masterParams.tunnelSpeed = Math.random() * 20;
          masterParams.cameraOrbitSpeed = Math.random() * 0.5;
          masterParams.cameraDollyAmount = Math.random();
          break;
        case 'randomizeWheels':
          randomizeAllWheels();
          break;
        case 'addWheel':
          addWheel();
          break;
        // Driver checkboxes
        case 'alignedOffsetDriver':
          drivers.alignedOffset.enabled = value;
          break;
        case 'cameraOrbitSpeedDriver':
          drivers.cameraOrbitSpeed.enabled = value;
          break;
        case 'cameraDollyAmountDriver':
          drivers.cameraDollyAmount.enabled = value;
          break;
        case 'orbitDepthDriver':
          drivers.orbitDepth.enabled = value;
          break;
        case 'orbitRadiusMultDriver':
          drivers.orbitRadiusMult.enabled = value;
          break;
        case 'orbitSpeedDriver':
          drivers.orbitSpeed.enabled = value;
          break;
        case 'orbitTiltXDriver':
          drivers.orbitTiltX.enabled = value;
          break;
        case 'orbitTiltYDriver':
          drivers.orbitTiltY.enabled = value;
          break;
        case 'tunnelDepthDriver':
          drivers.tunnelDepth.enabled = value;
          break;
        case 'tunnelSpeedDriver':
          drivers.tunnelSpeed.enabled = value;
          break;
        case 'masterAudioSensDriver':
          drivers.masterAudioSens.enabled = value;
          break;
        case 'masterSpinMultDriver':
          drivers.masterSpinMult.enabled = value;
          break;
        case 'masterDriftMultDriver':
          drivers.masterDriftMult.enabled = value;
          break;
        case 'masterGlobalScaleDriver':
          drivers.masterGlobalScale.enabled = value;
          break;
        case 'masterDiscCountMultDriver':
          drivers.masterDiscCountMult.enabled = value;
          break;
        case 'masterDiscSizeMultDriver':
          drivers.masterDiscSizeMult.enabled = value;
          break;
        case 'masterGlowStrengthDriver':
          drivers.masterGlowStrength.enabled = value;
          break;
        case 'masterOpacityEffectDriver':
          drivers.masterOpacityEffect.enabled = value;
          break;
      }
    }

    /**
     * Update layout visibility (for external controls)
     */
    function updateLayoutVisibility(mode) {
      // This is handled by the controls panel, but we keep it here for consistency
      masterParams.layoutMode = mode;
    }

    /**
     * Initialize BroadcastChannel communication
     */
    function initBroadcastChannel() {
      controlsChannel = new BroadcastChannel('visualizer-controls');
      controlsChannel.onmessage = handleControlMessage;
      
      // Also listen for window messages (from shell)
      window.addEventListener('message', handleWindowMessage);
    }

    // Initialize BroadcastChannel when script loads
    initBroadcastChannel();

    // Expose moduleAPI for loader.js (self-initializing module)
    window.moduleAPI = {
      initModule: async ({ controlsChannel: external } = {}) => {
        if (controlsChannel) return;
        controlsChannel = external || new BroadcastChannel('visualizer-controls');
        controlsChannel.onmessage = handleControlMessage;
      },
      start: async () => {},
      stop: async () => {},
      destroy: async () => {
        if (controlsChannel) { controlsChannel.close(); controlsChannel = null; }
        if (renderer) renderer.dispose();
      },
    };
  </script>
</body>
</html>
