<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaleidoscope Controls</title>
  <link rel="stylesheet" href="../../shared/ui.css">
  <link rel="stylesheet" href="../../shared/controls.css">
</head>
<body class="frisson-controls">
  <div class="control-panel">
    <header class="controls-heading"><p>Frisson / Controls</p><h1>Kaleidoscope</h1></header>
    
    <div class="controls-grid">
      <div class="controls-column">
        <div class="control-group">
          <h3>Global Settings</h3>
          
          <div class="control-item">
            <label class="control-label">
              Master Audio Sensitivity
              <span class="value" id="audioSensitivityValue">1.0</span>
            </label>
            <input type="range" id="audioSensitivity" min="0" max="2" step="0.1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Global Effect Intensity
              <span class="value" id="globalIntensityValue">1.0</span>
            </label>
            <input type="range" id="globalIntensity" min="0" max="1" step="0.01" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Brightness
              <span class="value" id="globalBrightnessValue">0.0</span>
            </label>
            <input type="range" id="globalBrightness" min="-0.5" max="0.5" step="0.01" value="0">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Contrast
              <span class="value" id="globalContrastValue">1.0</span>
            </label>
            <input type="range" id="globalContrast" min="0.5" max="2" step="0.1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Blend With Original
              <span class="value" id="globalBlendValue">1.0</span>
            </label>
            <input type="range" id="globalBlend" min="0" max="1" step="0.01" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Blur
              <span class="value" id="globalBlurValue">0.0</span>
            </label>
            <input type="range" id="globalBlur" min="0" max="10" step="0.1" value="0">
          </div>
        </div>
      </div>

      <div class="controls-column">
        <div class="control-group">
          <h3>Kaleidoscope</h3>
          
          <div class="control-item">
            <label class="control-label">
              Segments
              <span class="value" id="kaleidSegmentsValue">6</span>
            </label>
            <input type="range" id="kaleidSegments" min="2" max="12" step="1" value="6">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Audio-Reactive Segments
              <span class="value" id="audioReactiveSegmentsValue">0</span>
            </label>
            <input type="range" id="audioReactiveSegments" min="0" max="12" step="1" value="0">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Subdivisions
              <span class="value" id="kaleidSubdivisionsValue">1</span>
            </label>
            <input type="range" id="kaleidSubdivisions" min="1" max="8" step="1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Mirror Strength
              <span class="value" id="kaleidMirrorStrengthValue">1.0</span>
            </label>
            <input type="range" id="kaleidMirrorStrength" min="0" max="1" step="0.01" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Zoom
              <span class="value" id="kaleidZoomValue">1.0</span>
            </label>
            <input type="range" id="kaleidZoom" min="0.5" max="2" step="0.1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Rotation Speed
              <span class="value" id="kaleidRotationSpeedValue">0.0</span>
            </label>
            <input type="range" id="kaleidRotationSpeed" min="0" max="2" step="0.1" value="0">
          </div>
        </div>

        <div class="control-group">
          <h3>Multi-Center</h3>
          
          <div class="control-item">
            <label class="control-label">
              Rotation Centers
              <span class="value" id="rotationCentersValue">1</span>
            </label>
            <input type="range" id="rotationCenters" min="1" max="5" step="1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Center Orbit Radius
              <span class="value" id="centerOrbitRadiusValue">0.00</span>
            </label>
            <input type="range" id="centerOrbitRadius" min="0" max="0.7" step="0.01" value="0">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Center Orbit Speed
              <span class="value" id="centerOrbitSpeedValue">0.00</span>
            </label>
            <input type="range" id="centerOrbitSpeed" min="0" max="2" step="0.01" value="0">
          </div>
        </div>

        <div class="control-group">
          <h3>Fractal Recursion</h3>
          
          <div class="control-item">
            <label class="control-label">
              Fractal Recursion
              <span class="value" id="fractalRecursionValue">1</span>
            </label>
            <input type="range" id="fractalRecursion" min="1" max="4" step="1" value="1">
          </div>
          
          <div class="control-item">
            <label class="control-label">
              Recursion Scale
              <span class="value" id="recursionScaleValue">1.0</span>
            </label>
            <input type="range" id="recursionScale" min="1.0" max="3.0" step="0.1" value="1.0">
          </div>
        </div>

        <div class="control-group">
          <h3>Temporal Effects</h3>
          
          <div class="control-item">
            <label class="control-label">
              Temporal Feedback
              <span class="value" id="temporalFeedbackValue">0.00</span>
            </label>
            <input type="range" id="temporalFeedback" min="0" max="0.95" step="0.01" value="0">
          </div>
        </div>

        <div class="control-group">
          <h3>Presets</h3>
          
          <div class="control-item">
            <div class="button-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.5rem;">
              <button class="btn secondary" id="presetPsychedelic">Psychedelic</button>
              <button class="btn secondary" id="presetCompoundEye">Compound Eye</button>
            </div>
            <div class="button-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
              <button class="btn secondary" id="presetInfiniteTunnel">Infinite Tunnel</button>
              <button class="btn secondary" id="presetRainbowPulse">Rainbow Pulse</button>
            </div>
          </div>
        </div>
        

      </div>
    </div>
  </div>

  <div class="favorites-panel">
    <h3>Favorites</h3>
    <div class="favorites-section">
      <div class="favorites-input-group">
        <input type="text" id="favoriteName" placeholder="Favorite name" class="control-input" aria-label="Favorite name">
        <button id="saveFavoriteBtn" class="btn primary">Save favorite</button>
      </div>
      <div id="favoritesList" class="favorites-list"></div>
    </div>
  </div>

  <script type="module" src="./controls.js"></script>
  <script type="module" src="../../shared/controlsUI.js"></script>
</body>
</html>
